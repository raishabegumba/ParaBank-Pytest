[pytest]
# Pytest Configuration File
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=sys
    --disable-warnings
    -ra
markers =
    admin: Database admin endpoint tests (use -m "not admin" to exclude from regular runs)
    critical: Critical test suite - highest priority tests
    smoke: Smoke test suite - critical path tests
    regression: Regression test suite - comprehensive tests
    sanity: Sanity test suite - basic functionality
    ui: UI/Frontend tests
    api: API tests
    performance: Performance tests
    slow: Slow running tests
    skip_in_ci: Tests to skip in CI environment
    login: Login page tests
    registration: Registration page tests
    accounts: Accounts management tests
    transfer: Transfer funds tests
    bill_pay: Bill pay tests
    loan: Loan request tests
    transactions: Find transactions tests
    workflows: End-to-end workflow tests
    accessibility: Accessibility tests
    security: Security tests
    usability: Usability tests
    navigation: Navigation tests
    error_handling: Error handling tests
    browser_compatibility: Browser compatibility tests
    localization: Localization tests
    responsive: Responsive design tests
    edge_case: Edge case tests
    integration: Integration tests
    conditional: Conditional tests
    business_rules: Business rules tests
    data_validation: Data validation tests
    data_filtering: Data filtering tests
    advanced_search: Advanced search tests
    boundary: Boundary value tests
    sql_injection: SQL injection security tests
    authentication: Authentication security tests
    session_security: Session security tests
    csrf: CSRF security tests
    input_validation: Input validation tests
    security_headers: Security headers tests
    rate_limiting: Rate limiting tests
    directory_traversal: Directory traversal tests
    http_methods: HTTP methods security tests
    cookie_security: Cookie security tests
    content_security: Content security tests
    access_control: Access control tests
    workflow: Multi-module workflow tests
    data_export: Data export tests
    data_analysis: Data analysis tests
    positive: Positive test cases
    negative: Negative test cases
    open_account: Open account tests
    loan_request: Loan request tests
    find_transactions: Find transactions tests
    e2e: End-to-end tests
    xss: XSS security tests
    data_integrity: Data integrity tests
    mobile: Mobile device tests
    parallel: Parallel execution tests
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
